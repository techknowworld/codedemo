<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>codedemo</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --border: #243041;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      background: rgba(15, 23, 42, 0.65);
    }

    a:hover { border-color: var(--accent); }

    .label { font-weight: 600; }
    .desc { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>codedemo</h1>
    <p>Open one of the demo pages below.</p>
    <div class="links">
      <a href="nfc.html"><span class="label">NFC Toolkit</span><span class="desc">Read and write NFC tags</span></a>
      <a href="driver_dashboard.html"><span class="label">Driver Dashboard</span><span class="desc">Speed analytics dashboard</span></a>
      <a href="LocationDataMapper.html"><span class="label">Location Data Mapper</span><span class="desc">Plot location data on a map</span></a>
      <a href="driversroute.html"><span class="label">Driver Route Map</span><span class="desc">View the route demo</span></a>
    </div>
  </main>
</body>
</html>
